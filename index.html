
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="video"
    autoplay
    playsinline
    preload="auto"
  >
    <source src="pisakaka.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("video");

    video.muted = false;

    video.play().catch(() => {
      // The browser may block autoplay with sound.
      // No buttons or other interface are displayed.
    });
  </script>
</body>
</html>
