
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline preload="auto">
    <source src="./pisakaka.mp4" type="video/mp4">
  </video>

  <script>
    const v = document.getElementById("v");

    v.play().catch(() => {
      v.muted = true;
      v.play().catch(() => {});
    });
  </script>
</body>
</html>
